name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test · build · skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --workspace --release

      # The skill gate, run explicitly as well as via `cargo test`, so a regression is labelled as
      # one in the job list instead of hiding inside a generic test failure. Uses the release binary
      # already built above, since the gate fits the goal model and a debug build is several times
      # slower for no benefit.
      #
      # A failure here means the model got worse on the frozen fixture, not that a test is broken.
      # The command's output says which forecaster moved and by how much; if the change is deliberate,
      # record a new baseline with `skill-gate-update --note "why"` so the numbers being claimed show
      # up as a reviewable diff.
      - name: Skill regression gate
        run: ./target/release/wc-oracle skill-gate

  docker:
    name: docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build (don't push) the deploy image so the Dockerfile cannot silently rot. Layer caching
      # via the Actions cache keeps the dependency compile warm across runs (see cargo-chef).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: worldcup-oracle:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
