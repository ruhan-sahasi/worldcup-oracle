[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ruhan Sahasi <ruhan@marlo.today>"]
repository = "https://github.com/ruhan-sahasi/worldcup-oracle"
rust-version = "1.80"
description = "A live, ensemble World Cup prediction engine in Rust"

# Lints are declared once here and inherited by every member via `[lints] workspace = true`, which
# (unlike a `#![forbid(..)]` in each lib.rs) also covers binary and benchmark crate roots.
[workspace.lints.rust]
# Nothing in this workspace needs `unsafe`. Forbid rather than deny, so a local `#[allow]` cannot
# quietly reopen it.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Debugging leftovers, which CI's `-D warnings` then turns into a hard stop.
dbg_macro = "warn"
todo = "warn"
# A public function that can panic has to say so. Most panics here are internal invariants that
# cannot fire from outside; documenting them is how a reader tells those apart from the ones a
# caller can actually trigger.
missing_panics_doc = "warn"
# And a public function that can fail has to say what the failure means. A caller deciding whether to
# propagate or handle needs that, and reading the body to work it out is how a caller ends up
# handling the wrong thing. Most of the value here is in documenting what is *not* an error.
missing_errors_doc = "warn"

[workspace.dependencies]
# ---- internal crates ----
oracle-numeric = { path = "crates/oracle-numeric", version = "0.1.0" }
oracle-domain = { path = "crates/oracle-domain", version = "0.1.0" }
oracle-ratings = { path = "crates/oracle-ratings", version = "0.1.0" }
oracle-model = { path = "crates/oracle-model", version = "0.1.0" }
oracle-sim = { path = "crates/oracle-sim", version = "0.1.0" }
oracle-ingest = { path = "crates/oracle-ingest", version = "0.1.0" }
oracle-engine = { path = "crates/oracle-engine", version = "0.1.0" }
oracle-api = { path = "crates/oracle-api", version = "0.1.0" }
oracle-market = { path = "crates/oracle-market", version = "0.1.0" }
oracle-players = { path = "crates/oracle-players", version = "0.1.0" }
oracle-live = { path = "crates/oracle-live", version = "0.1.0" }
oracle-derivatives = { path = "crates/oracle-derivatives", version = "0.1.0" }
oracle-eval = { path = "crates/oracle-eval", version = "0.1.0" }

# ---- serialization / data ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }

# ---- errors ----
thiserror = "1"
anyhow = "1"

# ---- async runtime / web ----
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ---- cli / tui ----
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"

# ---- math / concurrency ----
csv = "1"
rayon = "1"
arc-swap = "1"

# ---- observability ----
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Keep unwinding (the default): a panic in one request handler should surface as a 500
# rather than abort the whole long-running server process.
