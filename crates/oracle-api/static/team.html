<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>worldcup-oracle · your team</title>
<style>
  :root {
    --bg: #0b1020; --panel: #141b2e; --line: #233; --text: #e7ecf5; --muted: #8892a6;
    --home: #ffd24a; --draw: #8892a6; --away: #58a6ff; --accent: #3fb950;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header a { color: var(--away); text-decoration: none; font-size: 13px; }
  .spacer { flex: 1; }
  main { max-width: 820px; margin: 0 auto; padding: 20px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  select, button { background: #0f1626; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--away); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  .hero { display: flex; align-items: baseline; gap: 14px; }
  .hero .name { font-size: 26px; font-weight: 700; }
  .hero .rank { color: var(--muted); }
  .hero .champ { margin-left: auto; text-align: right; }
  .hero .champ b { font-size: 26px; color: var(--accent); }
  .funnel .stage { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
  .funnel .label { width: 120px; color: var(--muted); flex: none; }
  .funnel .track { flex: 1; height: 14px; background: #0f1626; border-radius: 7px; overflow: hidden; }
  .funnel .fill { height: 14px; background: linear-gradient(90deg, var(--away), var(--accent)); border-radius: 7px; }
  .funnel .val { width: 52px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  .nextmatch { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .nextmatch .vs { font-size: 17px; font-weight: 600; }
  .wdl { display: flex; gap: 2px; flex: 1; min-width: 240px; height: 26px; border-radius: 6px; overflow: hidden; font-size: 11px; }
  .wdl span { display: flex; align-items: center; justify-content: center; color: #06101f; font-weight: 700; }
  .muted { color: var(--muted); }
  .chip { display: inline-block; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
  .hidden { display: none; }
  canvas { width: 100%; height: 90px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
  <header>
    <h1>⚽ worldcup-oracle</h1>
    <span class="chip">your team</span>
    <span class="spacer"></span>
    <a id="cardlink" href="/card">share card</a>
    <a href="/">live dashboard</a>
    <a href="/explore">model explorer</a>
  </header>

  <main>
    <div class="row">
      <label for="team">Team</label>
      <select id="team"></select>
      <button id="share" title="Copy a shareable link to this team">Copy link</button>
      <span id="share-ok" class="chip hidden">copied</span>
    </div>

    <div id="out" class="muted">Loading…</div>

    <div class="panel" id="kmpanel">
      <h2>Rooting interest</h2>
      <div class="row">
        <button id="load-km">Who should you root for?</button>
        <span id="km-status" class="muted"></span>
      </div>
      <div id="km-out" class="note">Which of your group rivals' results would most help your title odds (runs a few conditional simulations).</div>
    </div>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const pct = (x) => (100 * x).toFixed(1) + "%";
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const trend = [];   // recorded champion odds for the selected team

  async function loadTeams() {
    let list = [];
    try { list = await (await fetch("/teams")).json(); } catch (_) {}
    list.sort((a, b) => a.name.localeCompare(b.name));
    $("team").innerHTML = list.map(t => `<option value="${esc(t.code)}">${esc(t.name)}</option>`).join("");
  }

  function funnel(hub) {
    const stages = [
      ["Reach knockouts", hub.p_advance],
      ["Round of 16", hub.p_round_of_16],
      ["Quarter-final", hub.p_quarter],
      ["Semi-final", hub.p_semi],
      ["Final", hub.p_final],
      ["Champion", hub.p_champion],
    ];
    return `<div class="funnel">` + stages.map(([label, p]) =>
      `<div class="stage"><span class="label">${label}</span>
        <span class="track"><span class="fill" style="width:${Math.max(1, p * 100).toFixed(1)}%"></span></span>
        <span class="val">${pct(p)}</span></div>`).join("") + `</div>`;
  }

  function nextMatch(nm) {
    if (!nm) return `<div class="muted">No upcoming match - the tournament run is over for now.</div>`;
    const w = (nm.win * 100), d = (nm.draw * 100), l = (nm.loss * 100);
    const mls = nm.most_likely_score ? `most likely ${nm.most_likely_score[0]}-${nm.most_likely_score[1]}` : "";
    const side = nm.is_home ? "vs" : "at";
    return `<div class="nextmatch">
        <span class="vs">${side} ${esc(nm.opponent)}</span>
        <span class="chip">${esc(String(nm.stage))}</span>
        <div class="wdl">
          <span style="flex:${w};background:var(--home)" title="win">${w.toFixed(0)}%</span>
          <span style="flex:${d};background:var(--draw)" title="draw">${d.toFixed(0)}%</span>
          <span style="flex:${l};background:var(--away)" title="lose">${l.toFixed(0)}%</span>
        </div>
        <span class="muted">${mls}</span>
      </div>
      <div class="note">Win / draw / lose from ${esc(document.getElementById("team").selectedOptions[0]?.textContent || "your team")}'s perspective.</div>`;
  }

  function drawTrend() {
    const c = $("trend"); if (!c) return;
    const ctx = c.getContext("2d"); const W = c.width = c.clientWidth, H = c.height = 90;
    ctx.clearRect(0, 0, W, H);
    if (trend.length < 2) { ctx.fillStyle = "#8892a6"; ctx.font = "12px system-ui"; ctx.fillText("recording…", 8, 20); return; }
    const max = Math.max(...trend, 0.01), min = Math.min(...trend, 0);
    const x = (i) => 4 + i * (W - 8) / (trend.length - 1);
    const y = (v) => H - 6 - (v - min) / (max - min || 1) * (H - 16);
    ctx.strokeStyle = "#3fb950"; ctx.lineWidth = 2; ctx.beginPath();
    trend.forEach((v, i) => i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)));
    ctx.stroke();
  }

  async function render() {
    const code = $("team").value;
    if (!code) return;
    $("cardlink").href = "/card?team=" + encodeURIComponent(code);
    let hub;
    try { hub = await (await fetch(`/api/team?q=${encodeURIComponent(code)}`)).json(); }
    catch (_) { $("out").textContent = "could not load team"; return; }
    if (!hub || !hub.team) { $("out").textContent = "unknown team"; return; }
    trend.push(hub.p_champion); if (trend.length > 200) trend.shift();
    $("out").innerHTML = `
      <div class="panel">
        <div class="hero">
          <span class="name">${esc(hub.team)}</span>
          <span class="rank">#${hub.rank} to win it</span>
          <span class="champ"><span class="muted">champion</span><br><b>${pct(hub.p_champion)}</b></span>
        </div>
      </div>
      <div class="panel"><h2>Journey</h2>${funnel(hub)}</div>
      <div class="panel"><h2>Next match</h2>${nextMatch(hub.next_match)}</div>
      <div class="panel"><h2>Championship odds (this session)</h2><canvas id="trend"></canvas></div>`;
    drawTrend();
  }

  function writeHash() { location.hash = encodeURIComponent($("team").value); }
  function applyHash() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (h && [...$("team").options].some(o => o.value === h)) $("team").value = h;
  }

  async function loadKingmaker() {
    const code = $("team").value; if (!code) return;
    $("load-km").disabled = true; $("km-status").textContent = "simulating…"; $("km-out").innerHTML = "";
    try {
      const k = await (await fetch(`/api/kingmaker?q=${encodeURIComponent(code)}`)).json();
      $("km-status").textContent = "";
      if (!k.matches || !k.matches.length) { $("km-out").innerHTML = '<div class="muted">No group rivals to root for right now.</div>'; return; }
      const sw = (v) => `<span style="color:${v >= 0 ? '#3fb950' : '#f85149'}">${v >= 0 ? '+' : ''}${(v * 100).toFixed(1)}pp</span>`;
      let h = `<table><tr><th>Rival match</th><th>Home win</th><th>Draw</th><th>Away win</th></tr>`;
      k.matches.forEach(m => {
        h += `<tr><td>${esc(m.home_name)} v ${esc(m.away_name)}</td><td>${sw(m.home_win_swing)}</td><td>${sw(m.draw_swing)}</td><td>${sw(m.away_win_swing)}</td></tr>`;
      });
      $("km-out").innerHTML = h + `</table><div class="note">Swing to ${esc(k.team)}'s championship odds (base ${(k.base_champion * 100).toFixed(1)}%) under each result.</div>`;
    } catch (_) { $("km-status").textContent = "could not load"; }
    finally { $("load-km").disabled = false; }
  }
  $("load-km").onclick = loadKingmaker;

  $("team").onchange = () => { trend.length = 0; $("km-out").innerHTML = '<div class="note">Which of your group rivals\' results would most help your title odds (runs a few conditional simulations).</div>'; writeHash(); render(); };
  $("share").onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); $("share-ok").classList.remove("hidden"); setTimeout(() => $("share-ok").classList.add("hidden"), 1200); } catch (_) {}
  };

  loadTeams().then(() => { applyHash(); render(); });
  // Keep the journey and champion trend fresh as the tournament updates.
  setInterval(render, 15000);
</script>
</body>
</html>
